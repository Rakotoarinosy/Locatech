<!-- parametres.component.html -->
<div class="container-fluid py-4">

  <div class="row g-4">

    <!-- Section Catégories -->
    <div class="col-12 col-lg-6">
      <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-4">

          <h5 class="fw-bold text-dark mb-1">
            <i class="material-icons align-middle me-2 text-primary" style="font-size:20px">category</i>
            Catégories de matériels
          </h5>
          <p class="text-muted small mb-4">Gérez les catégories utilisées dans le catalogue matériels.</p>

          <!-- Formulaire ajout -->
          <div class="d-flex gap-2 mb-4">
            <input
              type="text"
              class="form-control rounded-3"
              placeholder="Nouvelle catégorie..."
              [(ngModel)]="newCategorieName"
              (keydown.enter)="addCategorie()"
              [disabled]="submitting">
            <button
              class="btn btn-primary rounded-3 px-3"
              (click)="addCategorie()"
              [disabled]="!newCategorieName.trim() || submitting">
              <i class="material-icons">add</i>
            </button>
          </div>

          <!-- Liste -->
          <div *ngIf="loading" class="text-center py-4 text-muted">
            <div class="spinner-border spinner-border-sm me-2"></div> Chargement...
          </div>

          <ul class="list-group list-group-flush" *ngIf="!loading">
            <li
              *ngFor="let cat of categories"
              class="list-group-item px-0 py-2 d-flex align-items-center gap-2 border-0 border-bottom">

              <!-- Mode édition -->
              <ng-container *ngIf="editingId === cat.id; else viewMode">
                <input
                  type="text"
                  class="form-control form-control-sm rounded-3 flex-grow-1"
                  [(ngModel)]="editingName"
                  (keydown.enter)="saveEdit()"
                  (keydown.escape)="cancelEdit()">
                <button class="btn btn-sm btn-success rounded-3" (click)="saveEdit()">
                  <i class="material-icons" style="font-size:16px">check</i>
                </button>
                <button class="btn btn-sm btn-light rounded-3" (click)="cancelEdit()">
                  <i class="material-icons" style="font-size:16px">close</i>
                </button>
              </ng-container>

              <!-- Mode affichage -->
              <ng-template #viewMode>
                <span class="flex-grow-1 fw-semibold text-dark">{{ cat.nom }}</span>
                <button class="btn btn-sm btn-light rounded-3" (click)="startEdit(cat)" title="Modifier">
                  <i class="material-icons" style="font-size:16px">edit</i>
                </button>
                <button class="btn btn-sm btn-light rounded-3 text-danger" (click)="deleteCategorie(cat)" title="Supprimer">
                  <i class="material-icons" style="font-size:16px">delete_outline</i>
                </button>
              </ng-template>

            </li>
            <li *ngIf="categories.length === 0" class="list-group-item px-0 border-0 text-muted text-center py-4">
              Aucune catégorie créée.
            </li>
          </ul>

        </div>
      </div>
    </div>

    <!-- Placeholder pour d'autres sections futures (ex: paramètres généraux) -->
    <div class="col-12 col-lg-6">
      <div class="card border-0 shadow-sm rounded-4 h-100">
        <div class="card-body p-4 d-flex align-items-center justify-content-center text-muted">
          <div class="text-center">
            <i class="material-icons mb-2" style="font-size:40px;opacity:0.3">tune</i>
            <p class="mb-0">D'autres paramètres seront disponibles ici.</p>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
