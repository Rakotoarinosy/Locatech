<!-- NAV BAR -->
<nav class="navbar navbar-expand-lg fixed-top custom-navbar">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center" href="#">
      <span class="logo-dot me-2"></span>
      <span class="fw-bold tracking-tight text-dark">Loca<span class="text-primary">Tech</span></span>
    </a>
    <button class="navbar-toggler" type="button" (click)="toggleNavbar()">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav" [class.show]="isNavbarOpen">
        <ul class="navbar-nav ms-auto align-items-center">
            <li class="nav-item">
                <a
                class="nav-link"
                [routerLink]="['/']"
                fragment="produits"
                (click)="closeNavbar()"
                >
                Matériels
                </a>
            </li>

            <li class="nav-item">
                <a
                class="nav-link"
                [routerLink]="['/']"
                fragment="features"
                (click)="closeNavbar()"
                >
                Fonctionnalités
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link fw-semibold text-primary d-flex align-items-center gap-1" [routerLink]="['/assistant-ia']" (click)="closeNavbar()">
                  <i class="bi bi-cpu"></i> Assistant IA 
                  <span class="badge rounded-pill bg-danger-subtle text-danger font-xs ms-1 border border-danger-subtle px-1">Beta</span>
                </a>
            </li>

            <li class="nav-item">
                <a
                class="nav-link"
                [routerLink]="['/']"
                fragment="analytics"
                (click)="closeNavbar()"
                >
                Statistiques
                </a>
            </li>

            <li class="nav-item">
                <a
                class="nav-link"
                [routerLink]="['/']"
                fragment="vision"
                (click)="closeNavbar()"
                >
                Notre Vision
                </a>
            </li>

            <li class="nav-item">
                <a
                class="nav-link"
                [routerLink]="['/']"
                fragment="contact"
                (click)="closeNavbar()"
                >
                Contact
                </a>
            </li>

            <li class="nav-item ms-lg-2">
                @if (compte.connecte()) {
                  <a class="nav-link d-flex align-items-center gap-1" routerLink="/mes-reservations" (click)="closeNavbar()">
                    <i class="bi bi-person-circle" aria-hidden="true"></i> Mes réservations
                  </a>
                } @else {
                  <a class="nav-link d-flex align-items-center gap-1" routerLink="/connexion" (click)="closeNavbar()">
                    <i class="bi bi-person" aria-hidden="true"></i> Se connecter
                  </a>
                }
            </li>

            <li class="nav-item ms-lg-2">
                <button
                type="button"
                class="btn btn-light rounded-circle panier-btn position-relative"
                [attr.aria-label]="'Ouvrir le panier, ' + panier.nombre() + ' matériel(s)'"
                (click)="closeNavbar(); panier.ouvert.set(true)"
                >
                <i class="bi bi-bag" aria-hidden="true"></i>
                @if (panier.nombre()) {
                  <span class="panier-count">{{ panier.nombre() }}</span>
                }
                </button>
            </li>

            <li class="nav-item ms-lg-3">
                <a
                [routerLink]="['/']"
                fragment="contact"
                class="btn btn-sm btn-primary btn-glow px-4 py-2 rounded-pill"
                (click)="closeNavbar()"
                >
                Démonstration
                </a>
            </li>

            </ul>
    </div>
  </div>
</nav>

<app-panier-drawer></app-panier-drawer>
