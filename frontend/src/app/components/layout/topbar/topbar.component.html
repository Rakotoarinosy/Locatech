<div class="topbar">
  <div class="tb-left">
    <button class="burger-btn" (click)="onToggle()" aria-label="Menu">
      <i class="bi" [class.bi-x-lg]="sidebarOpen" [class.bi-list]="!sidebarOpen"></i>
    </button>
    <div class="tb-title">
      <h5>{{ pageTitle }}</h5>
      <span class="tb-subtitle">Bienvenue sur LocaTech</span>
    </div>
  </div>

  <div class="topbar-search">
    <i class="bi bi-search"></i>
    <input type="text" placeholder="Rechercher..." />
  </div>

  <div class="tb-actions">
    <button class="tb-icon-btn">
      <i class="bi bi-bell"></i>
      <span class="notif-badge">3</span>
    </button>
    <button class="tb-icon-btn">
      <i class="bi bi-envelope"></i>
    </button>
    
    <!-- Zone profil cliquable -->
    <div class="dropdown">
      <div class="tb-profile" (click)="toggleDropdown($event)">
        <img src="https://i.pravatar.cc/100" alt="profile" class="tb-avatar">
        <div class="tb-profile-details">
          <div class="tb-profile-info">
            <span class="name">Fehizoro</span>
            <small>Administrateur</small>
          </div>
          <i class="bi bi-chevron-down ms-1 text-muted"></i>
        </div>
      </div>
      
      <!-- Menu de déconnexion Angularisé -->
      <ul class="dropdown-menu dropdown-menu-end modern-dropdown-menu" [class.show]="showDropdown">
        <li class="dropdown-header mobile-profile-header">
          <h6 class="mb-0 text-dark fw-bold">Fehizoro</h6>
          <small class="text-muted">Administrateur</small>
        </li>
        <li class="mobile-profile-header"><hr class="dropdown-divider"></li>
        <li>
          <a class="dropdown-item text-danger d-flex align-items-center gap-2" (click)="onLogout()" style="cursor: pointer;">
            <i class="bi bi-box-arrow-right"></i>
            <span>Se déconnecter</span>
          </a>
        </li>
      </ul>
    </div>

  </div>
</div>
