<div class="error-container">
  <div class="error-card">
    <div class="error-badge bg-warning-subtle text-warning">
      <i class="bi bi-shield-lock-fill"></i>
    </div>
    <h1 class="error-code">401</h1>
    <h2 class="error-title">Session expirée ou non autorisée</h2>
    <p class="error-desc">
      Votre jeton d'authentification n'est plus valide ou vos privilèges actuels ne vous permettent pas d'accéder à cette ressource de gestion.
    </p>
    <a routerLink="/login" class="btn btn-warning btn-action text-dark fw-bold">
      <i class="bi bi-box-arrow-in-right me-2"></i>Se reconnecter
    </a>
  </div>
</div>
