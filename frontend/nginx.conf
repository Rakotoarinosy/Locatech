server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Configuration injectée au démarrage (identifiant Google) : jamais en cache
    location = /runtime-config.json {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Surcharge réservée au développement local
    location = /runtime-config.local.json {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}