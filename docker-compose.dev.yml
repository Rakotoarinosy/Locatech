services:

  db:
    image: postgres:17
    container_name: locatech-db

    environment:
      POSTGRES_DB: locatech
      POSTGRES_USER: locatech
      POSTGRES_PASSWORD: locatech123

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U locatech -d locatech"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: locatech-frontend-dev

    ports:
      - "4200:4200"

    restart: unless-stopped

    depends_on:
      - backend


  backend:
    build:
      context: ./locatech
      dockerfile: Dockerfile

    container_name: locatech-backend

    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn backend.wsgi:application --bind 0.0.0.0:8045
      "

    volumes:
      - ./locatech:/app
      - ./locatech/media:/app/media 

    env_file:
      - .env.dev

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "8045:8045"

    restart: unless-stopped
  
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: locatech-n8n

    ports:
      - "5678:5678"

    env_file:
      - .env.dev
    volumes:
    - n8n_data:/home/node/.n8n

    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
  n8n_data: