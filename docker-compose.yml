services:

  db:
    image: postgres:17
    container_name: locatech-db

    environment:
      POSTGRES_DB: locatech
      POSTGRES_USER: locatech
      POSTGRES_PASSWORD: locatech123

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

  backend:
    build:
      context: ./locatech
      dockerfile: Dockerfile

    container_name: locatech-backend

    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn backend.wsgi:application --bind 0.0.0.0:8045
      "

    volumes:
      - ./locatech:/app
      - media_data:/app/media

    env_file:
      - .env

    depends_on:
      - db

    ports:
      - "8045:8045"

    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: locatech-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - media_data:/app/media          # même volume que backend
      - static_data:/app/staticfiles   # si tu sers aussi les statics via Nginx
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
  static_data: